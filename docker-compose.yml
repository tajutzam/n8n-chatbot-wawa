services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jakarta}
      - TZ=${TZ:-Asia/Jakarta}
      - N8N_PAYLOAD_SIZE_MAX=64
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  waha:
    image: devlikeapro/waha:arm
    container_name: waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_HOOK_URL=http://n8n:5678/webhook/waha-chatbot
      - WHATSAPP_HOOK_EVENTS=message
      - WAHA_API_KEY=admin
      - WAHA_DASHBOARD_USERNAME=wahas
      - WAHA_DASHBOARD_PASSWORD=wahas
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - waha_sessions:/app/.sessions
    depends_on:
      - n8n

volumes:
  n8n_data:
  qdrant_data:
  waha_sessions: