services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - NODE_ENV=production
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Jakarta}
      - TZ=${TZ:-Asia/Jakarta}
      - N8N_PAYLOAD_SIZE_MAX=64
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ---------- Opsi 1: WAHA ----------
  waha:
    profiles: ["waha"]
    image: devlikeapro/waha:arm
    container_name: waha
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - WHATSAPP_HOOK_URL=http://n8n:5678/webhook/waha-chatbot
      - WHATSAPP_HOOK_EVENTS=message
      - WAHA_API_KEY=admin
      - WAHA_DASHBOARD_USERNAME=wahas
      - WAHA_DASHBOARD_PASSWORD=wahas
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - waha_sessions:/app/.sessions
    depends_on:
      - n8n

  # ---------- Opsi 2: Evolution API ----------
  evolution-api:
    profiles: ["evolution"]
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=evolution-local-key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolutionpass@evolution-postgres:5432/evolution?schema=public
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution-redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=false
      - CACHE_LOCAL_ENABLED=false
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://n8n:5678/webhook/evolution-chatbot
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - TZ=${TZ:-Asia/Jakarta}
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started

  evolution-postgres:
    profiles: ["evolution"]
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolutionpass
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    profiles: ["evolution"]
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - evolution_redis_data:/data

volumes:
  n8n_data:
  qdrant_data:
  waha_sessions:
  evolution_instances:
  evolution_pg_data:
  evolution_redis_data: